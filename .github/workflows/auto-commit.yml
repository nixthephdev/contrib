name: Daily Activity

on:
  schedule:
    - cron: '0 0 * * *'   # 8am PHT
    - cron: '0 2 * * *'   # 10am PHT
    - cron: '0 4 * * *'   # 12pm PHT
    - cron: '0 6 * * *'   # 2pm PHT
    - cron: '0 8 * * *'   # 4pm PHT
    - cron: '0 10 * * *'  # 6pm PHT
    - cron: '0 12 * * *'  # 8pm PHT
    - cron: '0 14 * * *'  # 10pm PHT
    - cron: '0 16 * * *'  # 12am PHT
    - cron: '0 18 * * *'  # 2am PHT
    - cron: '0 20 * * *'  # 4am PHT
    - cron: '0 22 * * *'  # 6am PHT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure git
        run: |
          git config user.email "fidelbramosjunior@gmail.com"
          git config user.name "nixthephdev"

      - name: Commit activity
        run: |
          DAY=$(date +%u)   # 1=Mon ... 5=Fri ... 6=Sat ... 7=Sun
          HOUR=$(date +%H)  # UTC hour (PHT = UTC+8)

          # --- Day type ---
          if [ "$DAY" -eq 6 ] || [ "$DAY" -eq 7 ]; then
            DAY_TYPE="weekend"
          elif [ "$DAY" -eq 5 ]; then
            DAY_TYPE="friday"
          else
            DAY_TYPE="weekday"
          fi

          # --- PHT-aware skip threshold (higher = more likely to skip) ---
          # 0 UTC=8am, 2=10am, 4=12pm, 6=2pm PHT → peak hours
          # 8=4pm, 10=6pm PHT → winding down
          # 12=8pm, 14=10pm PHT → evening
          # 16=12am, 18=2am, 20=4am PHT → sleep
          # 22=6am PHT → early morning
          case "$HOUR" in
            00|02|04|06) BASE_SKIP=1 ;;  # peak (8am-2pm PHT)
            08)          BASE_SKIP=2 ;;  # 4pm PHT
            10)          BASE_SKIP=3 ;;  # 6pm PHT
            12)          BASE_SKIP=5 ;;  # 8pm PHT
            14)          BASE_SKIP=7 ;;  # 10pm PHT
            16|18|20)    BASE_SKIP=9 ;;  # 12am-4am PHT (sleep)
            22)          BASE_SKIP=8 ;;  # 6am PHT
            *)           BASE_SKIP=5 ;;
          esac

          # Adjust thresholds and commit ranges by day type
          if [ "$DAY_TYPE" = "weekend" ]; then
            SKIP_THRESHOLD=$(( BASE_SKIP + 2 ))
            [ "$SKIP_THRESHOLD" -gt 9 ] && SKIP_THRESHOLD=9
            MIN_COMMITS=1
            MAX_COMMITS=3

          elif [ "$DAY_TYPE" = "friday" ]; then
            SKIP_THRESHOLD=$(( BASE_SKIP - 1 ))
            [ "$SKIP_THRESHOLD" -lt 0 ] && SKIP_THRESHOLD=0
            MIN_COMMITS=5
            MAX_COMMITS=9

          else
            SKIP_THRESHOLD=$BASE_SKIP
            MIN_COMMITS=3
            MAX_COMMITS=5
          fi

          if [ $((RANDOM % 10)) -lt $SKIP_THRESHOLD ]; then
            echo "Skipping this run"
            exit 0
          fi

          # Random sleep up to 45 min to spread exact timestamps naturally
          sleep $((RANDOM % 2700))

          # --- Commit message generation ---
          SCOPES=("auth" "api" "ui" "db" "cache" "utils" "config" "parser" "logger" "validator" "router" "handler")

          PLAIN_MSGS=(
            "minor fix" "cleanup" "update" "small fix" "tweaks"
            "fix typo" "update config" "minor update" "clean up"
            "quick fix" "minor changes" "wip" "update notes"
            "hotfix" "patch" "fixes" "updates" "small update"
            "minor tweaks" "tidy up"
          )

          generate_msg() {
            SCOPE="${SCOPES[$RANDOM % ${#SCOPES[@]}]}"

            if [ $((RANDOM % 10)) -lt 4 ]; then
              # 40% plain casual
              echo "${PLAIN_MSGS[$RANDOM % ${#PLAIN_MSGS[@]}]}"
            else
              # 60% conventional with semantic grouping
              CATEGORY=$((RANDOM % 8))
              case $CATEGORY in
                0) PREFIX="fix"
                   ACTS=("resolve edge case" "correct off-by-one error" "handle null values" "patch broken validation" "fix race condition" "add missing return" "add missing guard clause" "fix broken flow" "fix incorrect regex")
                   ;;
                1) PREFIX="feat"
                   ACTS=("add input sanitization" "extend output format" "add utility helper" "add type annotations" "extend functionality" "add new endpoint" "add retry logic")
                   ;;
                2) PREFIX="perf"
                   ACTS=("optimize query performance" "reduce memory usage" "improve response time" "trim unnecessary dependencies" "cache repeated calls" "lazy load module")
                   ;;
                3) PREFIX="refactor"
                   ACTS=("simplify conditional logic" "extract repeated block" "rename variable for clarity" "consolidate duplicate logic" "refactor nested conditions" "update interface contract")
                   ;;
                4) PREFIX="style"
                   ACTS=("fix indentation issues" "improve readability" "clean up formatting" "remove trailing whitespace" "normalize spacing" "consistent quotes")
                   ;;
                5) PREFIX="test"
                   ACTS=("improve test coverage" "add edge case tests" "fix flaky test" "add missing assertions" "update test fixtures" "add integration test")
                   ;;
                6) PREFIX="docs"
                   ACTS=("add usage example" "update inline notes" "clarify function purpose" "add param descriptions" "update documentation")
                   ;;
                *) PREFIX="chore"
                   ACTS=("update dependencies" "clean up unused code" "remove redundant check" "routine maintenance" "update default values" "remove dead code")
                   ;;
              esac
              ACTION="${ACTS[$RANDOM % ${#ACTS[@]}]}"
              echo "$PREFIX($SCOPE): $ACTION"
            fi
          }

          # --- Files to rotate between ---
          FILES=(
            "logs/activity.log"
            "logs/debug.log"
            "data/metrics.txt"
            "config/env.txt"
          )

          COUNT=$(( RANDOM % (MAX_COMMITS - MIN_COMMITS + 1) + MIN_COMMITS ))

          for i in $(seq 1 $COUNT); do
            MSG=$(generate_msg)

            FILE="${FILES[$RANDOM % ${#FILES[@]}]}"
            mkdir -p "$(dirname "$FILE")"
            echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC') | $MSG" >> "$FILE"

            git add "$FILE"
            git commit -m "$MSG"
            sleep $((RANDOM % 90 + 15))
          done

          git push
